# ICT3113 A2 - Ticket Triage Service
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    container_name: g20-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # Cascade requires two models to be resident at the same time.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped

  triage:
    build: ./service
    container_name: g20-triage
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=${MODEL:-qwen2.5:3b}
      - CLASSIFICATION_MODE=${CLASSIFICATION_MODE:-single}
      - SMALL_MODEL=${SMALL_MODEL:-llama3.2:3b}
      - LARGE_MODEL=${LARGE_MODEL:-llama3.1:8b}
      - CASCADE_SETTING=${CASCADE_SETTING:-1}
      - CASCADE_ACCEPT_SETTING_1=${CASCADE_ACCEPT_SETTING_1:-}
      - CASCADE_ACCEPT_SETTING_2=${CASCADE_ACCEPT_SETTING_2:-}
      - RUN_ID=${RUN_ID:-manual}
      - NUM_CTX=${NUM_CTX:-4096}
      - OLLAMA_TIMEOUT_S=${OLLAMA_TIMEOUT_S:-600}
      - PROMPT_PATH=/app/prompts/classify_v1.txt
      - DB_PATH=/data/tickets.db
      - LOG_PATH=/logs/requests.jsonl
      - GUNICORN_WORKERS=1
      - GUNICORN_THREADS=8
    volumes:
      - ./prompts:/app/prompts:ro
      - ./logs:/logs
      - ./data:/data
    restart: unless-stopped

volumes:
  ollama_models:
